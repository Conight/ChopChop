<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ChopChop</title><link rel="stylesheet" href="style.css"></head><body>
<h1 data-i18n="sendTitle">Send to ChopChop</h1><p data-i18n="popupInstructions"></p>
<div id="links"></div><p id="status" role="status" data-i18n="looking">Looking for media…</p>
<div class="actions"><button id="send" class="primary" disabled data-i18n="sendSelected">Send Selected</button><button id="settings" data-i18n="pairBrowser">Pair Browser…</button></div>
<button id="include-context" data-i18n="includeContext"></button><p id="request-context" role="status"></p>
<p><a href="chopchop://browser" data-i18n="launchApp"></a></p>
<h2 data-i18n="recentSubmissions"></h2><button id="refresh-receipts" data-i18n="refreshReceipts"></button><div id="receipts" role="status"></div>
<script type="module" src="popup.js"></script></body></html>
