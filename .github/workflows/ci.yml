name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    uses: ./.github/workflows/verification.yml
  # Keep the existing required-check name and fail closed on cancelled/skipped lanes.
  test:
    if: always()
    needs: verification
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification lane
        env:
          RESULT: ${{ needs.verification.result }}
        run: test "$RESULT" = success
