name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - uses: ./.github/actions/verification-tools
      - name: Verify Swift, browser, real engine, media, and Release
        run: Scripts/verify.sh
