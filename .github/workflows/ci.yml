name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification gate or the complete UI suite
        type: choice
        default: verification
        options: [verification, ui]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.suite || 'verification' }}
  cancel-in-progress: true

jobs:
  verification:
    uses: ./.github/workflows/verification.yml
    with:
      suite: ${{ inputs.suite || 'verification' }}
  # Keep the existing required-check name and fail closed on cancelled/skipped lanes.
  test:
    if: always()
    needs: verification
    runs-on: ubuntu-24.04
    steps:
      - name: Require every verification lane
        env:
          RESULT: ${{ needs.verification.result }}
        run: test "$RESULT" = success
