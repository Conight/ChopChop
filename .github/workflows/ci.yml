name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Run unit and RPC regression tests
        run: Scripts/check.sh unit
      - name: Verify real engine downloads and resume
        run: python3 Scripts/smoke-aria2-next.py
      - name: Build hardened Release app
        run: Scripts/check.sh release
      - name: Verify release bundle
        run: python3 Scripts/verify-release-app.py DerivedData/Build/Products/Release/ChopChop.app
