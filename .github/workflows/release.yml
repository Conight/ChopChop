name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Build and verify a DMG without publishing or accessing the signing key.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verification-source:
    name: Resolve exact-SHA verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
      source_sha: ${{ steps.ci.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ci
        name: Reuse or wait for trusted main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          python3 Scripts/ci_gate.py --repository "$GITHUB_REPOSITORY" --sha "$source_sha"
  verification:
    needs: verification-source
    if: needs.verification-source.result == 'success' && needs.verification-source.outputs.reuse != 'true'
    uses: ./.github/workflows/verification.yml
    with:
      source-ref: ${{ needs.verification-source.outputs.source_sha }}
  build-and-publish:
    name: Build verified source and package DMG
    needs: [verification-source, verification]
    if: >-
      always() && needs.verification-source.result == 'success' &&
      (needs.verification-source.outputs.reuse == 'true' || needs.verification.result == 'success')
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      OUTPUT_DIR: build/distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verification-source.outputs.source_sha }}
      - name: Show build environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - uses: ./.github/actions/verification-tools
        with:
          browser: 'false'
          media: 'false'
      - name: Validate release identity and version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
            [[ "$(git cat-file -t "${GITHUB_REF}")" == tag ]]
            [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" == "$(git rev-parse HEAD)" ]]
            test -s "Documentation/Releases/${GITHUB_REF_NAME}.md"
          fi
          xcodebuild -showBuildSettings -json -project ChopChop.xcodeproj \
            -scheme ChopChop -configuration Distribution > "${RUNNER_TEMP}/build-settings.json"
          python3 - "${RUNNER_TEMP}/build-settings.json" <<'PY'
          import json, os, sys
          settings = next(item['buildSettings'] for item in json.load(open(sys.argv[1])) if item['target'] == 'ChopChop')
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              release_version = os.environ['GITHUB_REF_NAME']
              version = release_version[1:].split('-')[0]
              if settings['MARKETING_VERSION'] != version:
                  sys.exit(f"Tag version {version} does not match MARKETING_VERSION {settings['MARKETING_VERSION']}")
          else:
              release_version = f"v{settings['MARKETING_VERSION']}-ci.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_VERSION={release_version}\nCHOPCHOP_RELEASE_VERSION={release_version}\n')
          PY
      - name: Validate public release configuration
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 Scripts/release_config.py --check-repository "$RELEASE_REPOSITORY"
      - name: Archive verified source and verify mounted DMG
        run: Scripts/create-dmg.sh --output-dir "${OUTPUT_DIR}" --dmg-name "ChopChop-${RELEASE_VERSION}-macos-arm64"
      - name: Package the browser extension
        run: python3 Scripts/package-browser-extension.py --output-dir "${OUTPUT_DIR}"
      - name: Sign the verified update package
        if: github.event_name == 'push'
        env:
          CHOPCHOP_UPDATE_PRIVATE_KEY: ${{ secrets.CHOPCHOP_UPDATE_PRIVATE_KEY }}
        run: Scripts/sign-update-dmg.sh "${OUTPUT_DIR}/ChopChop-${GITHUB_REF_NAME}-macos-arm64.dmg" "${OUTPUT_DIR}/ChopChop-${GITHUB_REF_NAME}-update.json"
      - name: Verify checksums
        run: |
          cd "${OUTPUT_DIR}"
          for checksum in *.sha256; do shasum -a 256 -c "$checksum"; done
      - name: Preserve unpublished packaging rehearsal
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-rehearsal-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          compression-level: 0
          retention-days: 3
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Documentation/Releases/${GITHUB_REF_NAME}.md"
          flags=(--title "ChopChop ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          extension_version="$(python3 -c 'import json; print(json.load(open("BrowserExtension/manifest.json"))["version"])')"
          assets=(
            "${OUTPUT_DIR}/ChopChop-${GITHUB_REF_NAME}-macos-arm64.dmg#ChopChop for Apple Silicon"
            "${OUTPUT_DIR}/ChopChop-${GITHUB_REF_NAME}-macos-arm64.dmg.sha256#DMG SHA-256 checksum"
            "${OUTPUT_DIR}/ChopChop-${GITHUB_REF_NAME}-update.json#Signed update manifest"
            "${OUTPUT_DIR}/ChopChop-Extension-${extension_version}.zip#Chrome and Edge extension"
            "${OUTPUT_DIR}/ChopChop-Extension-${extension_version}.zip.sha256#Extension SHA-256 checksum"
          )
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" "${flags[@]}" --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --verify-tag --notes-file "${notes}" "${assets[@]}"
          fi
